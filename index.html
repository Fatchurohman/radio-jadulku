<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>60s Vintage Tape - fatur62</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="vintage-player">
        <!-- Status Bar -->
        <div class="top-bar">
            <span class="brand-tag">✦ ANALOG AUDIO SYSTEM ✦</span>
            <span class="dev-tag">DEV: <i>fatur62</i></span>
        </div>

        <!-- Radio Display (Seekbar) -->
        <div class="radio-display" id="freqDisplay">
            <div class="dial-scale">
                <span class="mhz">FM 88..90..94..98..102..108 MHz</span>
                <div class="khz">AM 550..700..900..1200..1600 kHz</div>
            </div>
            <div class="dial-needle" id="dialNeedle"></div>
            <div class="radio-light" id="radioLight"></div>
        </div>

        <!-- Middle Section -->
        <div class="middle-section">
            <!-- VU Meter -->
            <div class="vu-meter">
                <div class="vu-label">S-METER</div>
                <div class="vu-dial">
                    <div class="vu-needle" id="vuNeedle"></div>
                </div>
            </div>

            <!-- Cassette Deck Proporsional dengan Kaset Alami -->
            <div class="cassette-deck">
                <div class="cassette-body">
                    <!-- Label Stiker Kaset -->
                    <div class="cassette-label-sticker">
                        <span class="sticker-brand">fatur62 HIGH BIAS C-90</span>
                        <div class="ticker-wrapper">
                            <div class="clean-running-title" id="songTitle">Tidak Ada Lagu (Pilih File)</div>
                        </div>
                    </div>

                    <!-- Jendela Kaset & Pita Alami -->
                    <div class="tape-window" id="reelsArea">
                        <div class="reel-spool-left">
                            <div class="tape-roll" id="tapeRollLeft"></div>
                            <div class="reel-hub" id="leftReel">
                                <div class="hub-teeth"></div>
                            </div>
                        </div>

                        <div class="tape-bridge"></div>

                        <div class="reel-spool-right">
                            <div class="tape-roll" id="tapeRollRight"></div>
                            <div class="reel-hub" id="rightReel">
                                <div class="hub-teeth"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Volume Slider -->
            <div class="knob-panel">
                <div class="knob-container">
                    <label>VOLUME</label>
                    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.8">
                </div>
            </div>
        </div>

        <!-- Panel Controls Audio Jernih -->
        <div class="booster-panel">
            <div class="booster-title">🔊 AUDIO PREAMP & HIGH-FIDELITY</div>
            <div class="booster-controls">
                <div class="booster-item">
                    <label>EXTRA VOLUME</label>
                    <button id="btnBoost" class="toggle-btn">OFF</button>
                </div>
                <div class="booster-item">
                    <label>BASS ENHANCE</label>
                    <button id="btnBass" class="toggle-btn">OFF</button>
                </div>
            </div>
        </div>

        <!-- Physical Buttons -->
        <div class="button-panel">
            <label class="btn-tape btn-open" for="fileInput">
                <span>📁 FOLDER</span>
            </label>
            <button id="btnPrev" class="btn-tape">
                <span>⏮ PREV</span>
            </button>
            <button id="btnPlay" class="btn-tape">
                <span>▶ PLAY</span>
            </button>
            <button id="btnPause" class="btn-tape">
                <span>⏸ PAUSE</span>
            </button>
            <button id="btnNext" class="btn-tape">
                <span>⏭ NEXT</span>
            </button>
        </div>

        <!-- Playlist Card -->
        <div class="playlist-card">
            <div class="card-title">MEMORI LOKAL • DAFTAR LAGU</div>
            <ul id="playlistView" class="playlist-list">
                <li class="empty-msg">Klik [📁 FOLDER] untuk memilih lagu dari HP kamu.</li>
            </ul>
        </div>
    </div>

    <!-- Hidden Input & Engine -->
    <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
    <audio id="audioEngine"></audio>

    <script src="script.js"></script>
</body>
</html>
